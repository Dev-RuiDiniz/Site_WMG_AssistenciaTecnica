name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Qualidade, testes e build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Executar lint
        run: npm run lint

      - name: Executar type-check
        run: npm run typecheck

      - name: Executar testes
        run: npm test

      - name: Gerar build
        run: npm run build
